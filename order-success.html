<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Placed Successfully — New Desgin</title>
  <meta name="description" content="Thank you for shopping with New Desgin. Your order details and tracking link.">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="Images/Logo-noBG.png">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/rtl.css">

  <style>
    .success-page-section {
      padding: 3rem 0;
      min-height: 70vh;
    }

    .success-card {
      max-width: 680px;
      margin: 0 auto;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 2.25rem 2rem;
      box-shadow: var(--shadow-md);
      text-align: center;
    }

    .success-icon {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.25rem;
      margin: 0 auto 1.25rem;
    }

    .countdown-box {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 1rem 1.25rem;
      margin: 1.5rem 0;
      text-align: center;
    }

    .countdown-progress-bar {
      height: 6px;
      background-color: var(--border-color);
      border-radius: var(--radius-full);
      overflow: hidden;
      margin-top: 0.75rem;
    }

    .countdown-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--brand-blue), #38bdf8);
      width: 100%;
      transition: width 1s linear;
    }

    .order-details-box {
      text-align: left;
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 1.25rem 1.5rem;
      margin-top: 1.5rem;
    }

    [dir="rtl"] .order-details-box {
      text-align: right;
    }

    .item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.9rem;
    }

    .item-row:last-child {
      border-bottom: none;
    }
  </style>

  <script>
    const _t = localStorage.getItem("nd_theme") || "light";
    document.documentElement.setAttribute("data-theme", _t);
    window.CURRENT_PAGE = "order-success";
  </script>
</head>

<body>

  <!-- Shared Header Mount -->
  <div id="site-header-mount"></div>

  <!-- Success Main Content -->
  <main class="success-page-section">
    <div class="container">
      <div class="success-card">
        <div class="success-icon">✓</div>
        <h1 style="font-size: 1.75rem; font-weight: 900; margin-bottom: 0.5rem; color: var(--text-main);"
          id="sucHeaderTitle">Order Placed Successfully! 🎉</h1>
        <p style="color: var(--text-secondary); font-size: 0.95rem;" id="sucHeaderDesc">
          Thank you for shopping with New Desgin. Your order code is <strong id="sucOrderId"
            style="color: var(--brand-blue); font-family: monospace; font-size: 1.15rem;">#ND-000000</strong>
        </p>

        <!-- 30-Second Countdown Auto Redirect Box -->
        <div class="countdown-box">
          <div
            style="display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; font-weight: 600; color: var(--text-main);">
            <span id="sucCountdownText">Auto-redirecting to homepage in <strong id="sucTimerVal"
                style="color: var(--brand-blue);">30</strong>s</span>
            <a href="index.html" class="btn btn-secondary btn-sm" style="padding: 4px 12px; font-size: 0.8rem;"
              id="sucHomeBtn">Return Now</a>
          </div>
          <div class="countdown-progress-bar">
            <div class="countdown-progress-fill" id="sucProgressFill"></div>
          </div>
        </div>

        <!-- Actions Row -->
        <div style="display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; margin-bottom: 1.5rem;"
          id="sucActionsRow">
          <a href="#" id="sucWaBtn" target="_blank" class="btn btn-primary"
            style="background: #25D366; border-color: #25D366; color: white; display: flex; align-items: center; gap: 6px;">
            💬 <span>Open WhatsApp Chat</span>
          </a>
          <a href="#" id="sucTrackBtn" class="btn btn-secondary" style="display: flex; align-items: center; gap: 6px;">
            🔍 <span>Track Order Status</span>
          </a>
        </div>

        <!-- Auth Button (Logged Out) -->
        <div class="auth-state-logged-out">
          <button type="button" class="action-btn auth-modal-open-btn" aria-label="Sign In / Register" title="Sign In">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </button>
        </div>

        <!-- Order Summary Details Box -->
        <div class="order-details-box" id="sucOrderDetails">
          <h4
            style="font-size: 1rem; font-weight: 700; color: var(--text-main); margin-bottom: 0.75rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--border-color);"
            id="sucSummaryTitle">📦 Order Breakdown</h4>
          <div id="sucOrderItems"></div>
          <div
            style="margin-top: 1rem; padding-top: 0.75rem; border-top: 2px solid var(--border-color); display: flex; justify-content: space-between; font-weight: 800; font-size: 1.05rem; color: var(--text-main);">
            <span id="sucTotalLabel">Total Amount:</span>
            <span id="sucTotalVal" style="color: var(--brand-blue);">$0.00</span>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Shared Footer Mount -->
  <div id="site-footer-mount"></div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <!-- App Modules -->
  <script src="js/config.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/currency.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/store-info.js"></script>
  <script src="js/header.js"></script>
  <script src="js/footer.js"></script>



  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const isAr = typeof I18nManager !== "undefined" && I18nManager.currentLang === "ar";
      const urlParams = new URLSearchParams(window.location.search);
      const queryId = urlParams.get("id");

      let orderData = null;
      try {
        const saved = sessionStorage.getItem("nd_last_order");
        if (saved) orderData = JSON.parse(saved);
      } catch (e) { }

      const orderId = queryId || (orderData ? orderData.orderId : "ND-ORDER");

      // Update Header Text
      if (isAr) {
        document.getElementById("sucHeaderTitle").textContent = "تم إرسال الطلب بنجاح! 🎉";
        document.getElementById("sucHeaderDesc").innerHTML = `شكراً لتسوقك من نيو ديزاين. رقم طلبك هو <strong style="color: var(--brand-blue); font-family: monospace; font-size: 1.15rem;">#${orderId}</strong>`;
        document.getElementById("sucCountdownText").innerHTML = `إعادة التوجيه إلى الرئيسية خلال <strong id="sucTimerVal" style="color: var(--brand-blue);">30</strong> ثانية`;
        document.getElementById("sucHomeBtn").textContent = "العودة للرئيسية الآن";
        document.getElementById("sucSummaryTitle").textContent = "📦 تفاصيل الطلبية والعميل";
        document.getElementById("sucTotalLabel").textContent = "المجموع الإجمالي:";
      } else {
        document.getElementById("sucOrderId").textContent = `#${orderId}`;
      }

      // Action Buttons
      const trackBtn = document.getElementById("sucTrackBtn");
      if (trackBtn) trackBtn.href = `track.html?id=${orderId}`;

      const waBtn = document.getElementById("sucWaBtn");
      if (waBtn && orderData && orderData.waUrl) {
        waBtn.href = orderData.waUrl;
      } else if (waBtn) {
        waBtn.style.display = "none";
      }

      // Render items if available
      const itemsContainer = document.getElementById("sucOrderItems");
      if (orderData && orderData.items && itemsContainer) {
        const curSym = orderData.currency === "USD" || orderData.currency === "$" ? "$" : (isAr ? "د.ل" : "LYD");
        itemsContainer.innerHTML = orderData.items.map(item => {
          const pName = isAr ? (item.nameAr || item.name) : item.name;
          const unitPrice = parseFloat(item.price);
          const lineTotal = unitPrice * (item.quantity || 1);
          return `
            <div class="item-row">
              <div>
                <strong style="color: var(--text-main);">${pName}</strong>
                <div style="font-size: 0.8rem; color: var(--text-muted);">
                  ${item.size ? 'Size: ' + item.size : ''} ${item.color ? '· Color: ' + item.color : ''}
                </div>
              </div>
              <div style="text-align: ${isAr ? 'left' : 'right'}; font-weight: 700;">
                <div>${item.quantity}x @ ${unitPrice.toFixed(2)} ${curSym}</div>
                <div style="color: var(--brand-blue);">${lineTotal.toFixed(2)} ${curSym}</div>
              </div>
            </div>
          `;
        }).join("");

        const totalValEl = document.getElementById("sucTotalVal");
        if (totalValEl) totalValEl.textContent = `${parseFloat(orderData.finalTotal || orderData.total || 0).toFixed(2)} ${curSym}`;
      } else if (itemsContainer) {
        itemsContainer.style.display = "none";
      }

      // 30-Second Countdown Timer
      let timeLeft = 30;
      const timerValEl = document.getElementById("sucTimerVal");
      const progressFillEl = document.getElementById("sucProgressFill");

      const interval = setInterval(() => {
        timeLeft--;
        if (timerValEl) timerValEl.textContent = timeLeft;
        if (progressFillEl) {
          const percent = (timeLeft / 30) * 100;
          progressFillEl.style.width = `${percent}%`;
        }

        if (timeLeft <= 0) {
          clearInterval(interval);
          window.location.href = "index.html";
        }
      }, 1000);
    });
  </script>
</body>

</html>
